replicaCount: 1

image:
  repository: ghcr.io/thepphithakp/vertex-bff
  pullPolicy: Always
  tag: ""

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3000

# ปลายทางภายในคลัสเตอร์ ไม่ผ่าน ingress
# ออกไปข้างนอกแล้ววนกลับเข้ามาคือเสียเวลาเปล่าและพังง่ายกว่า
upstream:
  petServiceURL: "http://pet-service:4001"
  authServiceURL: "http://auth-service:4000"
  eventServiceURL: "http://event-service:4002"
  timeout: "10s"

# publicBaseURL คือที่อยู่ที่ client มองเห็นจากภายนอก ใช้ประกอบ avatarUrl
#
# ⚠️ ห้ามใส่ค่าจริงลงไฟล์นี้ — repo เป็น public
#    ส่งตอน deploy ด้วย --set publicBaseURL=...
publicBaseURL: ""

graphql:
  # เพดานของ query — rate limit ที่นับจำนวน request ใช้กับ GraphQL แทบไม่ได้ผล
  # เพราะหนึ่ง request แพงเท่าไหร่ก็ได้ และ endpoint นี้เปิดออกอินเทอร์เน็ต
  #
  # ต้องมีทั้งสองตัวเพราะกันคนละอย่าง:
  # maxDepth กัน query ที่ซ้อนวนเป็นทอดๆ (ลึกแต่อาจราคาถูก)
  # maxComplexity กัน query ที่ขอ list ใหญ่ซ้อนกัน (แพงแต่อาจลึกแค่สามชั้น)
  #
  # 5000 เลือกจากการวัด query จริงของแอป — LitterDay ที่ขอ 200 แถวราคา 1221
  # ส่วน query ที่ขอ 200 แถวแล้วซ้อน caregiver ต่อราคาเกินหมื่น
  # ตั้งต่ำกว่านี้จะบล็อกผู้ใช้จริงก่อนบล็อกคนยิงถล่ม (ดู guardrail_test.go)
  maxComplexity: 5000
  # ต้องเท่ากับความลึกสูงสุดที่ schema เป็นไปได้ — ตอนนี้ 9
  # ตั้งสูงกว่านั้น = เพดานที่ไม่มีทางถูกแตะ ให้ความมั่นใจปลอมๆ
  # guardrail_test.go บังคับให้สองค่านี้ตรงกัน
  #
  # 0 = ไม่บังคับ ห้ามใช้บน production
  maxDepth: 9
  # ปิดบน production ไม่ให้ใครดึง schema ทั้งก้อนไปดู
  enableIntrospection: false

# คำวิเคราะห์ด้วย LLM บนหน้าน้ำ (VT-108)
#
# key อยู่ใน Secret ที่สร้างแยกนอก chart — ไม่ผ่าน values และไม่ผ่าน CI
# เพราะ repo นี้เป็น public และ values ถูก render ลง log ของ helm ได้
# ไม่มี Secret = ฟิลด์ waterInsight คืน null แล้วแอปใช้ข้อความสำรองของตัวเอง
ai:
  secretName: gemini-api-key
  secretKey: GEMINI_API_KEY
  # ไล่ลองตามลำดับ ตัวแรกคือตัวหลัก — โควตาของ free tier แยกก้อนต่อโมเดล
  # การมีหลายตัวจึงเพิ่มจำนวนครั้งที่ใช้ได้จริง ไม่ใช่แค่กันพลาด
  #
  #   flash-lite   15 RPM / 500 RPD
  #   3.5-flash     5 RPM /  20 RPD   ← เอาไว้ท้ายสุด
  #
  # ทดสอบกับ key จริงแล้ว: 2.5-flash ตอบ 404 จึงไม่อยู่ในลำดับ
  # ส่วน lite ตอบเร็วกว่า (1.5 วินาที เทียบกับ 2.3) และคุณภาพพอกัน
  models: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash
  # สั้นกว่า upstream timeout เพราะผู้ใช้รอหน้าจออยู่
  # ยอมไม่มีคำวิเคราะห์ ดีกว่าให้ทั้งหน้าค้างรอ LLM
  timeout: 8s
  # cache คิดจากลายนิ้วมือของตัวเลข ไม่ใช่ตามเวลา — ข้อความจะเปลี่ยน
  # เมื่อพฤติกรรมการกินน้ำเปลี่ยน ไม่ใช่เปลี่ยนเพราะครบชั่วโมง
  cacheTTL: 6h

ingress:
  enabled: true
  className: nginx
  # host ส่งตอน deploy เช่นกัน ห้าม hardcode
  host: ""
  path: /graphql
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

# GraphQL ใช้ CPU น้อยแต่รอ I/O เยอะ ตั้ง limit ให้พอสำหรับ burst
# ตอน resolve หลาย field พร้อมกัน
#
# บทเรียนจาก VT-103: บีบ CPU แน่นเกินไปทำให้ช้าขึ้นสิบเท่าโดยหาสาเหตุยากมาก
# เพราะดูจากภายนอกเหมือนแค่ช้า ไม่มี error อะไรเลย
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
env: []

# ให้ Prometheus มาดึง /metrics (VT-109)
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  # ⚠️ ไม่ใส่ label นี้ = ServiceMonitor ถูกสร้างแต่ไม่มีใครมาดึง และไม่มีอะไรฟ้อง
  #    Prometheus ในคลัสเตอร์นี้เลือกด้วย matchLabels: {release: prometheus-grafana}
  additionalLabels:
    release: prometheus-grafana
